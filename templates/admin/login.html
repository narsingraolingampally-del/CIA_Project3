{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrator Login | CIA Examination System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e40af,#2563eb);

    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;

}

.login-box{

    width:440px;

    background:#fff;

    border-radius:22px;

    padding:45px;

    box-shadow:0 20px 50px rgba(0,0,0,.30);

}

.logo{

    width:95px;
    height:95px;

    margin:auto;

    border-radius:50%;

    background:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;

    font-size:42px;

}

.title{

    margin-top:20px;

    font-size:28px;

    font-weight:700;

    color:#0f172a;

}

.subtitle{

    color:#6b7280;

    margin-bottom:30px;

}

.form-label{

    font-weight:600;

}

.form-control{

    height:52px;

    border-radius:12px;

}

.input-group-text{

    background:#2563eb;

    color:#fff;

    border:none;

    width:55px;

    justify-content:center;

}

.btn-login{

    height:52px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:#fff;

    font-size:18px;

    font-weight:600;

    transition:.3s;

}

.btn-login:hover{

    background:#1d4ed8;

}

.footer{

    text-align:center;

    margin-top:20px;

    color:#6b7280;

    font-size:14px;

}

.alert{

    border-radius:10px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="text-center">

<div class="logo">
<i class="fas fa-user-shield"></i>
</div>

<div class="title">
Administrator Login
</div>

<div class="subtitle">
CIA Examination Management System
</div>

</div>

{% if form.errors %}
<div class="alert alert-danger">
Invalid username or password.
</div>
{% endif %}

<form method="post">

{% csrf_token %}

<input type="hidden" name="next" value="{{ next }}">

<div class="mb-3">

<label class="form-label">
Username
</label>

<div class="input-group">

<span class="input-group-text">
<i class="fas fa-user"></i>
</span>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter administrator username"
required>

</div>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="fas fa-lock"></i>
</span>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

</div>

<button type="submit" class="btn btn-login w-100">

<i class="fas fa-right-to-bracket"></i>

Login

</button>

</form>

<div class="footer">

<hr>

<i class="fas fa-shield-halved"></i>

Secure Administrator Portal

</div>

</div>

</body>
</html>

{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
    CIA Student Login
</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: linear-gradient(
            135deg,
            #0f172a,
            #2563eb
        );

        font-family:
            'Segoe UI',
            sans-serif;

        padding: 20px;

    }


    .login-card {

        width: 430px;

        max-width: 100%;

        background: white;

        padding: 40px;

        border-radius: 18px;

        box-shadow:
            0 20px 40px rgba(0,0,0,0.25);

    }


    .logo {

        width: 90px;

        height: 90px;

        margin: 0 auto 20px auto;

        display: flex;

        justify-content: center;

        align-items: center;

        background: #2563eb;

        color: white;

        font-size: 40px;

        border-radius: 50%;

    }


    h1 {

        text-align: center;

        color: #0f172a;

        margin-bottom: 5px;

        font-size: 30px;

    }


    .subtitle {

        text-align: center;

        color: #6b7280;

        margin-bottom: 30px;

    }


    label {

        font-weight: 600;

        display: block;

        margin-bottom: 6px;

        color: #1f2937;

    }


    input {

        width: 100%;

        padding: 12px;

        border-radius: 10px;

        border: 1px solid #ccc;

        font-size: 16px;

        margin-bottom: 18px;

        transition: 0.2s ease;

    }


    input:focus {

        outline: none;

        border-color: #2563eb;

        box-shadow:
            0 0 0 3px rgba(37,99,235,0.12);

    }


    button {

        width: 100%;

        padding: 14px;

        background: #2563eb;

        border: none;

        color: white;

        border-radius: 10px;

        font-size: 17px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s ease;

    }


    button:hover {

        background: #1d4ed8;

    }


    .error {

        background: #fee2e2;

        color: #b91c1c;

        padding: 12px;

        border-radius: 10px;

        margin-bottom: 20px;

        text-align: center;

    }


    .college-name {

        text-align: center;

        color: #2563eb;

        font-size: 15px;

        font-weight: 700;

        margin-top: 25px;

    }


    .college-system {

        text-align: center;

        color: #9ca3af;

        font-size: 12px;

        margin-top: 4px;

    }


    @media (max-width: 480px) {

        .login-card {

            padding: 30px 25px;

        }

        h1 {

            font-size: 26px;

        }

    }

</style>
```

</head>

<body>

<div class="login-card">

```
<!-- STUDENT ICON -->

<div class="logo">

    🎓

</div>


<!-- TITLE -->

<h1>

    CIA Student Portal

</h1>


<!-- SUBTITLE -->

<div class="subtitle">

    Examination Management System

</div>


<!-- MESSAGES -->

{% if messages %}

    {% for message in messages %}

        <div class="error">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}


<!-- LOGIN FORM -->

<form method="POST">

    {% csrf_token %}


    <label>
        Username
    </label>

    <input
        type="text"
        name="username"
        placeholder="Enter username"
        autocomplete="username"
        required
    >


    <label>
        Password
    </label>

    <input
        type="password"
        name="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
    >


    <button type="submit">

        Login

    </button>

</form>


<!-- COLLEGE BRANDING -->

<div class="college-name">

    Bhavan's Vivekananda College

</div>

<div class="college-system">

    CIA Examination Management System

</div>
```

</div>

</body>

</html>

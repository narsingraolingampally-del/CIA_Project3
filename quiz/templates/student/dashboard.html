{% extends "base.html" %}

{% block content %}

<h1 style="color:red;">
    THIS IS MY TEMPLATE
</h1>

<p>
Number of exams: {{ exams|length }}
</p>

{% for exam in exams %}

<h3>
{{ exam.exam_name }}
</h3>

<p>
Subject: {{ exam.subject.name }}
</p>

<a href="{% url 'take_exam' exam.id %}">
Start Exam
</a>

{% empty %}

<h3>
NO EXAMS FOUND
</h3>

{% endfor %}

{% endblock %}

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Login | CIA Portal</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>


body{

    height:100vh;
    background:linear-gradient(
        135deg,
        #0f172a,
        #2563eb
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI',sans-serif;

}



/* Login Card */

.login-card{

    width:420px;

    background:white;

    border-radius:20px;

    padding:40px;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.25);

}



/* Icon */

.login-icon{

    width:90px;

    height:90px;

    background:#2563eb;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    color:white;

    font-size:45px;

}



/* Input */

.form-control{

    height:50px;

    border-radius:10px;

}



.input-group-text{

    background:#2563eb;

    color:white;

    border:none;

}



.btn-login{

    height:50px;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:18px;

    font-weight:600;

}



.btn-login:hover{

    background:#1d4ed8;

}



/* Title */

.portal-title{

    font-weight:700;

    color:#0f172a;

}



</style>


</head>



<body>



<div class="login-card">



<div class="text-center mb-4">


<div class="login-icon">

<i class="fas fa-chalkboard-user"></i>

</div>



<h2 class="portal-title mt-3">

Faculty Login

</h2>


<p class="text-muted">

CIA Examination Management System

</p>


</div>






{% if messages %}

{% for message in messages %}

<div class="alert alert-{{ message.tags }}">

{{ message }}

</div>

{% endfor %}

{% endif %}






<form method="POST">


{% csrf_token %}




<div class="mb-3">


<label class="form-label">

Username

</label>


<div class="input-group">


<span class="input-group-text">

<i class="fas fa-user"></i>

</span>


<input 
type="text"
name="username"
class="form-control"
placeholder="Enter Faculty Username"
required>


</div>


</div>






<div class="mb-4">


<label class="form-label">

Password

</label>



<div class="input-group">


<span class="input-group-text">

<i class="fas fa-lock"></i>

</span>


<input 
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>



</div>


</div>






<button class="btn btn-login w-100">


<i class="fas fa-sign-in-alt"></i>

Login


</button>





</form>





<hr>


<div class="text-center">


<a href="{% url 'index' %}"
class="text-decoration-none">


<i class="fas fa-arrow-left"></i>

Back to Home


</a>


</div>




</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        CIA Admin Login
    </title>


    <style>


        *{
            box-sizing:border-box;
        }


        body{

            margin:0;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                135deg,
                #0f172a,
                #2563eb
            );

            font-family:
            'Segoe UI',
            sans-serif;

        }



        .login-card{

            width:430px;

            background:white;

            padding:40px;

            border-radius:18px;

            box-shadow:
            0 20px 40px rgba(0,0,0,0.25);

        }



        .logo{

            width:90px;

            height:90px;

            margin:auto;

            display:flex;

            justify-content:center;

            align-items:center;

            background:#2563eb;

            color:white;

            font-size:40px;

            border-radius:50%;

            margin-bottom:20px;

        }



        h1{

            text-align:center;

            color:#0f172a;

            margin-bottom:5px;

            font-size:30px;

        }



        .subtitle{

            text-align:center;

            color:#6b7280;

            margin-bottom:30px;

        }



        label{

            font-weight:600;

            display:block;

            margin-bottom:6px;

        }



        input{

            width:100%;

            padding:12px;

            border-radius:10px;

            border:1px solid #ccc;

            font-size:16px;

            margin-bottom:18px;

        }



        input:focus{

            outline:none;

            border-color:#2563eb;

        }



        button{

            width:100%;

            padding:14px;

            background:#2563eb;

            border:none;

            color:white;

            border-radius:10px;

            font-size:17px;

            font-weight:600;

            cursor:pointer;

        }



        button:hover{

            background:#1d4ed8;

        }



        .error{

            background:#fee2e2;

            color:#b91c1c;

            padding:12px;

            border-radius:10px;

            margin-bottom:20px;

            text-align:center;

        }


    </style>


</head>



<body>



<div class="login-card">


    <div class="logo">

        🔐

    </div>



    <h1>

        CIA Admin Portal

    </h1>



    <div class="subtitle">

        Examination Management System

    </div>




    {% if messages %}

        {% for message in messages %}

            <div class="error">

                {{ message }}

            </div>


        {% endfor %}

    {% endif %}




    <form method="POST">


        {% csrf_token %}



        <label>

            Username

        </label>


        <input

            type="text"

            name="username"

            placeholder="Enter username"

            required

        >




        <label>

            Password

        </label>


        <input

            type="password"

            name="password"

            placeholder="Enter password"

            required

        >




        <button type="submit">

            Login

        </button>



    </form>



</div>



</body>


</html>

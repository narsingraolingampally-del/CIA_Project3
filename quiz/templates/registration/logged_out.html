{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Logged Out | CIA Examination Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

body{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

.card{
    width:480px;
    border:none;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#198754;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:40px;
}

.btn-home{
    background:#2563eb;
    color:white;
    border:none;
}

.btn-home:hover{
    background:#1d4ed8;
    color:white;
}

.btn-login{
    background:#198754;
    color:white;
    border:none;
}

.btn-login:hover{
    background:#157347;
    color:white;
}

</style>

</head>

<body>

<div class="card p-5 text-center">

<div class="icon mb-4">
<i class="fas fa-check"></i>
</div>

<h2 class="fw-bold">
Logout Successful
</h2>

<p class="text-muted mt-3">
You have successfully logged out of the
<strong>CIA Examination Management System.</strong>
</p>

<div class="d-grid gap-3 mt-4">

<a href="{% url 'index' %}" class="btn btn-home btn-lg">
<i class="fas fa-home"></i>
 Back to Home
</a>

<a href="{% url 'faculty_login' %}" class="btn btn-login btn-lg">
<i class="fas fa-sign-in-alt"></i>
 Login Again
</a>

</div>

</div>

</body>
</html>

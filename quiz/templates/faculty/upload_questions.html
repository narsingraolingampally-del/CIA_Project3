{% extends "base.html" %}
{% load static %}

{% block content %}

<div style="display: flex; min-height: 100vh;">

    {% include "faculty/sidebar.html" %}

    <main class="main-canvas"
          style="flex:1; padding:40px; background:#f4f7f6;">

        <div class="container">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="fas fa-upload"></i>
                        Upload Question Paper
                    </h3>

                </div>

                <div class="card-body">

                    <a href="/media/sample_question_format.xlsx"
                       class="btn btn-primary mb-3">

                        <i class="fas fa-download"></i>
                        Download Sample Excel

                    </a>

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            {{ form.subject }}

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Excel File
                            </label>

                            {{ form.excel_file }}

                        </div>

                        <button type="submit"
                                class="btn btn-success">

                            <i class="fas fa-upload"></i>
                            Upload Questions

                        </button>

                        <a href="{% url 'faculty_dashboard' %}"
                           class="btn btn-secondary">

                            Back

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>

{% endblock %}
